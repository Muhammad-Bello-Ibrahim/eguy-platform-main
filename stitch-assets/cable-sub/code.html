<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>eGuy - Cable Subscriptions</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#47f0d1",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221e",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(71, 240, 209, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 240, 209, 0.1);
        }
        .active-provider {
            border: 2px solid #47f0d1;
            background: rgba(71, 240, 209, 0.15);
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .ios-bottom-sheet {
            border-top-left-radius: 2rem;
            border-top-right-radius: 2rem;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col relative overflow-hidden bg-background-dark">
<!-- Header -->
<header class="px-6 pt-12 pb-6 flex items-center justify-between sticky top-0 bg-background-dark/80 backdrop-blur-md z-10">
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 border border-white/10 text-white">
<span class="material-icons-round">arrow_back_ios_new</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-white">Cable TV</h1>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 border border-white/10 text-white">
<span class="material-icons-round">history</span>
</button>
</header>
<main class="flex-1 px-6 pb-32">
<!-- Provider Selection -->
<section class="mb-8">
<div class="flex items-center justify-between mb-4">
<h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Select Provider</h2>
</div>
<div class="flex gap-4 overflow-x-auto custom-scrollbar pb-2">
<!-- DStv -->
<div class="active-provider flex-shrink-0 w-24 h-24 rounded-xl flex flex-col items-center justify-center transition-all duration-300">
<div class="w-12 h-12 mb-2 rounded-full overflow-hidden bg-slate-800 flex items-center justify-center border border-white/10">
<img class="w-full h-full object-cover" data-alt="Blue and white DStv brand logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsRqgGLe4H6lXb740sBZzO5NFWn9UKloQORXhoJBUxC1zVDpvwaVFySJTPINA9eDpR-wYJ_nMIOzZ9LkD4bVvpJoc4WlnYieUT_72WepMEGGqiIipyajglxal4MEWbWicq0hJRaTwraUlxIHtsaEj1d7V-Zt_xdvBiKG1p7CG3QMIHEWBekZ9-k0a2uZYFsZB8yQ-YgpoT4EJOF04fhaEss4dpVfGBhnUelsC4hQ8Ob5GrmqBkk8SpFE7dGofIEYowzG0V_ZBU5Uw"/>
</div>
<span class="text-xs font-bold text-primary">DStv</span>
</div>
<!-- GOtv -->
<div class="glass-card flex-shrink-0 w-24 h-24 rounded-xl flex flex-col items-center justify-center">
<div class="w-12 h-12 mb-2 rounded-full overflow-hidden bg-slate-800 flex items-center justify-center border border-white/10">
<img class="w-full h-full object-cover" data-alt="Green and neon GOtv brand logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBW8N_eGXOdXMcaQ88w4mrUVL82fbmAUzsUO3gxv4Dw5ItXbekqTJSibn_UO7UMjUwKTTnjC_z6wpuc0Nj4ErCVyoF6qv8rDwPilCEiFSNDr3oO-tSt7cF82lSg0Qqb2OWs1FZnZ7UkSO1Mpud7S8TZSNhXufUFN-qn50ldvHSPeqrsJ2ZQ8P3sy4PbXDetM3QmCi7-VHWnyZCMe3-F3mOmYMIZ2rDnecMnVArD9IRegwCeNVIIzZazk1I1ajEXQ-w5DyDzP_uEW3M"/>
</div>
<span class="text-xs font-medium text-slate-400">GOtv</span>
</div>
<!-- StarTimes -->
<div class="glass-card flex-shrink-0 w-24 h-24 rounded-xl flex flex-col items-center justify-center">
<div class="w-12 h-12 mb-2 rounded-full overflow-hidden bg-slate-800 flex items-center justify-center border border-white/10">
<img class="w-full h-full object-cover" data-alt="Red and white StarTimes brand logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBo6ovzR-NsCu-5dVUY4A1MQuBjUV0IzCYPRaf8uxStk1lNXlY1XC40GnRvfWsLJaBOmxzows9ya1eKbajHA08qS9m6CHBfzi69sZyXL65NUBPCWf0uoxSu6-FvBhyD5uMa137Zjt8GBoAYjR2YOKJl1kjJGVSoTVSDuGHqe8jjjy7m4A0rNQsOAqUYErHDXDPRft3zbP2Mn6CcFmRbOK7WW2AFZ18awHNlXxAVSfmorar9PfmqvAjAZzdTfoMl2HWoEQyFl7eqXyo"/>
</div>
<span class="text-xs font-medium text-slate-400">StarTimes</span>
</div>
<!-- Showmax -->
<div class="glass-card flex-shrink-0 w-24 h-24 rounded-xl flex flex-col items-center justify-center">
<div class="w-12 h-12 mb-2 rounded-full overflow-hidden bg-slate-800 flex items-center justify-center border border-white/10">
<img class="w-full h-full object-cover" data-alt="Red and black streaming service logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGVeGWVqEL26vUn-Hh2-e8vsddvIX0t9-C76nXp10yoCzTaMMHf4agEoVKeWUl3Pa_CVAfLhe1Lk4FTDJXAhMoWai3xq8qnPG9nJXI4LX9JQznU-ElNKpTvePbmBcf11yXzCnrKsOaWDiWI4YU-uwebizBGZK2HTai7Ufq890q12VDiohng9Cl8XCY0NZKQM9gko33pWu4PRJfw_pFMv1dE18Sh-5fSfGbLD2Ss2wr5fdukhtNaZrnx001Lg82uCMuBmVCBrsQhlo"/>
</div>
<span class="text-xs font-medium text-slate-400">Showmax</span>
</div>
</div>
</section>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Smartcard Field -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-400 ml-1">Smartcard / IUC Number</label>
<div class="relative group">
<input class="w-full bg-slate-800/50 border-white/10 rounded-lg py-4 px-5 text-white placeholder:text-slate-600 focus:ring-primary focus:border-primary transition-all pr-12" placeholder="Enter 10-digit number" type="text" value="1054329871"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary">
<span class="material-icons-round">check_circle</span>
</div>
</div>
<!-- Validation Response -->
<div class="flex items-center gap-2 px-1 text-sm">
<span class="text-slate-400">Customer:</span>
<span class="text-white font-bold">ALEXANDER PIERCE</span>
</div>
</div>
<!-- Package Dropdown -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-400 ml-1">Select Package</label>
<button class="w-full bg-slate-800/50 border border-white/10 rounded-lg py-4 px-5 flex items-center justify-between text-white group active:scale-[0.98] transition-all">
<div class="flex flex-col items-start">
<span class="font-bold">DStv Premium + French</span>
<span class="text-xs text-slate-400">Monthly Subscription</span>
</div>
<span class="material-icons-round text-primary group-hover:translate-y-1 transition-transform">expand_more</span>
</button>
</div>
<!-- Auto-renewal Toggle -->
<div class="flex items-center justify-between p-4 glass-card rounded-lg border border-white/5">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-icons-round">sync</span>
</div>
<div>
<p class="text-sm font-bold text-white">Enable Auto-renewal</p>
<p class="text-xs text-slate-400">Never miss a match</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
<!-- Summary Card -->
<div class="mt-8 p-6 bg-gradient-to-br from-primary/20 to-transparent border border-primary/20 rounded-xl relative overflow-hidden group">
<div class="absolute -right-12 -top-12 w-32 h-32 bg-primary/10 blur-3xl group-hover:bg-primary/20 transition-all"></div>
<h3 class="text-xs font-bold uppercase tracking-widest text-primary mb-4">Payment Summary</h3>
<div class="space-y-3">
<div class="flex justify-between text-sm">
<span class="text-slate-400">Package Amount</span>
<span class="text-white font-semibold">₦24,500.00</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-slate-400">Convenience Fee</span>
<span class="text-white font-semibold">₦100.00</span>
</div>
<div class="pt-3 border-t border-white/10 flex justify-between items-end">
<span class="text-sm text-slate-400 font-medium">Total Payable</span>
<div class="text-right">
<span class="block text-2xl font-extrabold text-primary">₦24,600.00</span>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Button -->
<div class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto p-6 bg-background-dark/95 backdrop-blur-xl border-t border-white/5">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-extrabold py-5 rounded-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.97] transition-all">
<span class="material-icons-round text-xl">lock</span>
<span>SECURELY PAY NOW</span>
</button>
<div class="mt-4 flex justify-center items-center gap-1">
<span class="material-icons-round text-slate-500 text-xs">verified_user</span>
<span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">PCI-DSS Compliant Secure Gateway</span>
</div>
</div>
<!-- Floating UI Decoration -->
<div class="absolute top-0 right-0 -z-10 w-64 h-64 bg-primary/5 blur-[100px] rounded-full"></div>
<div class="absolute bottom-40 -left-20 -z-10 w-64 h-64 bg-primary/10 blur-[100px] rounded-full"></div>
</div>
</body></html>
