<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Confirmation Summary | eGuy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#47f0d1",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221e",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(16, 34, 30, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .ios-shadow {
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center font-display">
<!-- Mock Background Dashboard (Simulating the dashboard behind the modal) -->
<div class="fixed inset-0 w-full h-full p-6 flex flex-col gap-6 opacity-40 select-none">
<div class="flex justify-between items-center">
<div class="h-10 w-10 bg-primary/20 rounded-full flex items-center justify-center">
<span class="material-icons-round text-primary">person</span>
</div>
<div class="h-10 w-10 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-icons-round text-primary/40">notifications</span>
</div>
</div>
<div class="h-48 w-full bg-primary/10 rounded-xl border border-primary/5 p-6">
<div class="h-4 w-24 bg-primary/20 rounded mb-4"></div>
<div class="h-8 w-48 bg-primary/30 rounded mb-8"></div>
<div class="flex gap-4">
<div class="h-10 flex-1 bg-primary/20 rounded-lg"></div>
<div class="h-10 flex-1 bg-primary/20 rounded-lg"></div>
</div>
</div>
<div class="space-y-4">
<div class="h-4 w-32 bg-primary/10 rounded"></div>
<div class="h-16 w-full bg-primary/5 rounded-lg border border-primary/5"></div>
<div class="h-16 w-full bg-primary/5 rounded-lg border border-primary/5"></div>
<div class="h-16 w-full bg-primary/5 rounded-lg border border-primary/5"></div>
</div>
</div>
<!-- Payment Confirmation Bottom Sheet (iOS Style) -->
<div class="fixed inset-0 z-50 flex flex-col justify-end">
<!-- Backdrop Blur Overlay -->
<div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
<!-- Modal Content -->
<div class="glass-panel w-full max-w-md mx-auto rounded-t-xl border-t border-white/10 ios-shadow animate-slide-up relative overflow-hidden">
<!-- Handle bar -->
<div class="flex justify-center pt-3 pb-6">
<div class="w-10 h-1 bg-white/20 rounded-full"></div>
</div>
<div class="px-6 pb-10">
<!-- Header -->
<div class="text-center mb-8">
<h2 class="text-white text-lg font-bold tracking-tight mb-2">Confirm Transaction</h2>
<p class="text-primary/70 text-sm font-medium">Utility Bill Payment</p>
</div>
<!-- Main Icon & Provider -->
<div class="flex flex-col items-center mb-10">
<div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mb-4 ring-1 ring-primary/30">
<span class="material-icons-round text-primary text-4xl">bolt</span>
</div>
<h3 class="text-white text-xl font-bold">City Power Grid</h3>
<p class="text-white/40 text-xs mt-1">Provider ID: CP-0921-2X</p>
</div>
<!-- Transaction Details -->
<div class="bg-white/5 rounded-xl p-5 mb-8 border border-white/5">
<div class="space-y-4">
<div class="flex justify-between items-center">
<span class="text-white/50 text-sm">Recipient</span>
<span class="text-white font-medium text-sm">Acc #987654321</span>
</div>
<div class="flex justify-between items-center">
<span class="text-white/50 text-sm">Service Type</span>
<span class="text-white font-medium text-sm">Electricity</span>
</div>
<div class="flex justify-between items-center">
<span class="text-white/50 text-sm">Service Fee</span>
<span class="text-white font-medium text-sm">$0.50</span>
</div>
<div class="pt-4 border-t border-white/10 flex justify-between items-center">
<span class="text-white font-bold">Total Amount</span>
<span class="text-primary text-2xl font-extrabold tracking-tight">$50.50</span>
</div>
</div>
</div>
<!-- Authorization Section -->
<div class="mb-10">
<p class="text-center text-white/60 text-xs uppercase tracking-widest font-bold mb-4">Enter PIN to Authorize</p>
<div class="flex justify-center gap-4">
<div class="w-12 h-14 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
</div>
<div class="w-12 h-14 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
</div>
<div class="w-12 h-14 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-white/20 rounded-full"></div>
</div>
<div class="w-12 h-14 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-white/20 rounded-full"></div>
</div>
</div>
</div>
<!-- Actions -->
<div class="space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-extrabold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Confirm Payment</span>
<span class="material-icons-round text-xl">arrow_forward</span>
</button>
<button class="w-full py-2 flex items-center justify-center gap-2 group">
<div class="p-2 rounded-full bg-white/5 group-hover:bg-white/10 transition-colors">
<span class="material-icons-round text-primary text-xl">face</span>
</div>
<span class="text-white/60 text-sm font-semibold">Pay with FaceID</span>
</button>
<button class="w-full pt-4 text-white/40 text-sm font-medium hover:text-white/60 transition-colors">
                        Cancel &amp; Return
                    </button>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-4"></div>
</div>
</div>
</div>
</body></html>
