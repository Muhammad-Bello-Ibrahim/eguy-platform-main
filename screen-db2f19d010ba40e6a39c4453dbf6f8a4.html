<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Your eGuy Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#47f0d1",
            "background-light": "#f6f8f8",
            "background-dark": "#10221e", // Darkened slightly to align with user's #131321 intent but using theme hue
            "surface-dark": "#162b27",
            "input-dark": "#1a322e",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      background-color: #10221e;
      font-family: 'Manrope', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .network-bg {
      background-image: radial-gradient(circle at 2px 2px, rgba(71, 240, 209, 0.05) 1px, transparent 0);
      background-size: 32px 32px;
    }
    .glossy-card {
      background: rgba(22, 43, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(71, 240, 209, 0.1);
    }
    .ios-status-bar {
        height: 44px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-0 m-0">
<!-- Mobile Device Container -->
<div class="relative w-full max-w-[430px] h-[932px] bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl flex flex-col">
<!-- Background Decoration -->
<div class="absolute inset-0 network-bg pointer-events-none opacity-40"></div>
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-primary/10 rounded-full blur-[100px]"></div>
<!-- iOS Status Bar Simulation -->
<div class="ios-status-bar relative z-10">
<div class="text-[15px] font-semibold">9:41</div>
<div class="flex items-center space-x-1.5">
<span class="material-icons text-[18px]">signal_cellular_alt</span>
<span class="material-icons text-[18px]">wifi</span>
<span class="material-icons text-[20px]">battery_full</span>
</div>
</div>
<!-- Content Area -->
<div class="flex-1 px-8 pt-6 pb-12 relative z-10 flex flex-col">
<!-- Back Button & Header -->
<div class="mb-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-dark/50 mb-6 hover:bg-primary/20 transition-colors">
<span class="material-icons text-primary">arrow_back_ios_new</span>
</button>
<h1 class="text-3xl font-extrabold tracking-tight mb-2">Create Your Account</h1>
<p class="text-slate-400 font-medium">Join the network growth platform.</p>
</div>
<!-- Step Indicator -->
<div class="mb-10">
<div class="flex items-center justify-between mb-4">
<span class="text-xs font-bold uppercase tracking-widest text-primary">Step 1 of 3</span>
<span class="text-xs font-medium text-slate-500">Account Info</span>
</div>
<div class="flex gap-2 h-1.5 w-full">
<div class="flex-1 bg-primary rounded-full shadow-[0_0_10px_rgba(71,240,209,0.5)]"></div>
<div class="flex-1 bg-surface-dark rounded-full"></div>
<div class="flex-1 bg-surface-dark rounded-full"></div>
</div>
</div>
<!-- Registration Form -->
<div class="space-y-5 flex-1">
<!-- Full Name -->
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Full Name</label>
<div class="relative group">
<input class="w-full bg-input-dark border-transparent focus:border-primary/50 focus:ring-4 focus:ring-primary/10 rounded-xl py-4 px-5 transition-all outline-none text-slate-100 placeholder:text-slate-600" placeholder="John Doe" type="text"/>
<span class="material-icons absolute right-4 top-1/2 -translate-y-1/2 text-slate-600 group-focus-within:text-primary">person_outline</span>
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Email Address</label>
<div class="relative group">
<input class="w-full bg-input-dark border-transparent focus:border-primary/50 focus:ring-4 focus:ring-primary/10 rounded-xl py-4 px-5 transition-all outline-none text-slate-100 placeholder:text-slate-600" placeholder="name@email.com" type="email"/>
<span class="material-icons absolute right-4 top-1/2 -translate-y-1/2 text-slate-600 group-focus-within:text-primary">mail_outline</span>
</div>
</div>
<!-- Referral Code -->
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Referral Code <span class="text-slate-600 lowercase font-normal">(optional)</span></label>
<div class="relative group">
<input class="w-full bg-input-dark border-transparent focus:border-primary/50 focus:ring-4 focus:ring-primary/10 rounded-xl py-4 px-5 transition-all outline-none text-slate-100 placeholder:text-slate-600" placeholder="Enter code" type="text"/>
<span class="material-icons absolute right-4 top-1/2 -translate-y-1/2 text-slate-600 group-focus-within:text-primary">confirmation_number</span>
</div>
</div>
<!-- Continue Button -->
<div class="pt-4">
<button class="w-full bg-primary text-background-dark font-bold text-lg py-4 rounded-full shadow-[0_8px_32px_rgba(71,240,209,0.3)] hover:scale-[1.02] active:scale-[0.98] transition-all">
            Continue
          </button>
</div>
<!-- Divider -->
<div class="flex items-center py-6">
<div class="flex-1 h-[1px] bg-slate-800"></div>
<span class="px-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Or continue with</span>
<div class="flex-1 h-[1px] bg-slate-800"></div>
</div>
<!-- Social Auth -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-3 bg-surface-dark border border-slate-800 py-3.5 rounded-full hover:bg-slate-800 transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPMQFLJ2Id6v9ehjRE5CnihUiQVS2YsOmjdFzwwRGtk3rhtuCI9h1HZLPsb5HmwjZ3PEKtzzvByW3_gMdn1lJO_erezmxczay8UY43G0WGfdZvExdnHVCpoQvKbvf_9cTZJyZU7QPJKxE_N9f5TwHx7IU7uUFCy3c6pOH05Be24e2sRuDptlx6FgjBpotSeDpvJMm0AfJ8pfzQgJGwKZDsehKY_8VvMzazqUtmQrnGIU0wvAUdb5DFcr_mAVzwTcYrcTUmuQ7NCWY"/>
<span class="font-semibold text-sm">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-3 bg-surface-dark border border-slate-800 py-3.5 rounded-full hover:bg-slate-800 transition-colors">
<span class="material-icons text-xl">apple</span>
<span class="font-semibold text-sm">Apple</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-auto pt-8 text-center">
<p class="text-slate-400 font-medium">
          Already have an account? 
          <a class="text-primary font-bold ml-1 hover:underline" href="#">Log In</a>
</p>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1.5 bg-slate-800/50 rounded-full mx-auto mt-8"></div>
</div>
</div>
</body></html>
