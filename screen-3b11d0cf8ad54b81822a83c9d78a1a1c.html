<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recovery Email Sent - eGuy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#47f0d1",
                "background-light": "#f6f8f8",
                "background-dark": "#10221e",
                "surface-dark": "#162e29",
                "muted-dark": "#2a423d"
              },
              fontFamily: {
                "display": ["Manrope"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-shadow {
            box-shadow: 0 10px 30px -10px rgba(71, 240, 209, 0.2);
        }
        .glass-panel {
            background: rgba(22, 46, 41, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 240, 209, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 flex items-center justify-center min-h-screen">
<!-- iOS Phone Container -->
<div class="relative w-[375px] h-[812px] bg-background-light dark:bg-background-dark overflow-hidden flex flex-col items-center px-8 shadow-2xl border-[8px] border-slate-900 dark:border-muted-dark rounded-[3rem]">
<!-- Status Bar Area -->
<div class="w-full h-11 flex justify-between items-center px-6 pt-2">
<span class="text-xs font-bold">9:41</span>
<div class="flex items-center space-x-1">
<span class="material-icons-round text-sm">signal_cellular_alt</span>
<span class="material-icons-round text-sm">wifi</span>
<span class="material-icons-round text-sm rotate-90">battery_full</span>
</div>
</div>
<!-- Dynamic Island / Notch -->
<div class="absolute top-2 left-1/2 -translate-x-1/2 w-32 h-8 bg-black rounded-full z-50"></div>
<!-- Main Content Wrapper -->
<div class="flex-1 w-full flex flex-col justify-center items-center text-center">
<!-- Success Icon Section -->
<div class="relative mb-10">
<!-- Outer Glow -->
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
<div class="relative w-24 h-24 bg-primary/10 border border-primary/20 rounded-full flex items-center justify-center ios-shadow">
<span class="material-icons-round text-primary text-5xl">send_and_archive</span>
</div>
<!-- Floating Small Icons -->
<div class="absolute -top-2 -right-2 bg-primary rounded-full p-1.5 shadow-lg">
<span class="material-icons-round text-background-dark text-xs font-bold">check</span>
</div>
</div>
<!-- Text Content -->
<h1 class="text-3xl font-extrabold mb-4 tracking-tight">Check your Inbox</h1>
<p class="text-slate-500 dark:text-slate-400 leading-relaxed mb-12">
                We've sent a password reset link to <br/>
<span class="text-primary font-bold">user@email.com</span>. <br/>
                Please check your spam folder if you don't see it.
            </p>
<!-- Buttons Stack -->
<div class="w-full space-y-4">
<!-- Primary Action -->
<button class="w-full bg-primary text-background-dark font-bold py-4 rounded-xl hover:opacity-90 transition-all flex items-center justify-center space-x-2">
<span>Resend Email</span>
</button>
<!-- Secondary Action -->
<button class="w-full bg-transparent text-slate-500 dark:text-slate-400 font-semibold py-4 rounded-xl hover:text-primary transition-all flex items-center justify-center space-x-2">
<span class="material-icons-round text-sm">arrow_back</span>
<span>Back to Login</span>
</button>
</div>
<!-- Verification Image / Abstract Decor -->
<div class="mt-16 w-full opacity-30">
<div class="w-full h-24 rounded-2xl bg-gradient-to-r from-transparent via-primary/20 to-transparent flex items-center justify-center">
<span class="material-icons-round text-primary/40 text-6xl">security</span>
</div>
</div>
</div>
<!-- Bottom Safe Area Indicator -->
<div class="w-32 h-1.5 bg-slate-400/20 rounded-full mb-2"></div>
<!-- Background Decorative Elements -->
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -top-20 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
</div>
</body></html>
