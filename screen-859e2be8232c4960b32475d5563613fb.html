<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>eGuy - Create New Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#46F0D2",
                        "eguy-dark": "#131321",
                        "input-bg": "#1a1a2e",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "2xl": "1.5rem",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(70, 240, 210, 0.15);
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#131321] text-white min-h-screen flex items-center justify-center font-display antialiased">
<div class="relative w-full max-w-[400px] h-screen sm:h-[844px] bg-[#131321] overflow-hidden flex flex-col px-8 pt-16 pb-12 shadow-2xl sm:rounded-3xl">
<div class="absolute top-0 left-0 w-full h-12 flex items-center justify-between px-8 text-xs font-semibold opacity-60">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<div class="mb-8">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-icons">arrow_back_ios_new</span>
</button>
</div>
<div class="flex flex-col items-center justify-center mb-10">
<div class="relative group">
<div class="absolute inset-0 bg-primary/20 blur-[50px] rounded-full"></div>
<div class="relative w-24 h-24 bg-input-bg border border-primary/20 rounded-full flex items-center justify-center glow-effect overflow-hidden">
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary via-transparent to-transparent"></div>
<span class="material-symbols-outlined text-5xl text-primary drop-shadow-[0_0_10px_rgba(70,240,210,0.5)]">shield_lock</span>
</div>
</div>
<h1 class="mt-8 text-3xl font-extrabold tracking-tight text-center bg-gradient-to-b from-white to-white/70 bg-clip-text text-transparent">
                Create New Password
            </h1>
<p class="mt-3 text-center text-slate-400 font-medium px-4 leading-relaxed text-sm">
                Your new password must be different from previous passwords.
            </p>
</div>
<div class="flex-grow flex flex-col space-y-6">
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-500 ml-1" for="new-password">New Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 text-xl">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-5 bg-input-bg border-0 ring-1 ring-white/10 rounded-2xl focus:ring-2 focus:ring-primary focus:bg-[#1f1f3a] text-white placeholder-slate-600 transition-all duration-300 outline-none" id="new-password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
<div class="mt-3 px-1">
<div class="flex justify-between items-center mb-1.5">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Strength: <span class="text-primary">Strong</span></span>
<span class="text-[10px] font-bold text-slate-500">80%</span>
</div>
<div class="flex space-x-1.5">
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-white/10"></div>
</div>
</div>
</div>
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-500 ml-1" for="confirm-password">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 text-xl">verified_user</span>
</div>
<input class="block w-full pl-12 pr-12 py-5 bg-input-bg border-0 ring-1 ring-white/10 rounded-2xl focus:ring-2 focus:ring-primary focus:bg-[#1f1f3a] text-white placeholder-slate-600 transition-all duration-300 outline-none" id="confirm-password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary hover:bg-[#3de0c3] active:scale-[0.98] text-[#131321] font-bold py-5 rounded-2xl shadow-lg shadow-primary/20 transition-all duration-300 flex items-center justify-center space-x-2 mt-4">
<span class="font-extrabold uppercase tracking-tight">Save &amp; Sign In</span>
<span class="material-symbols-outlined font-bold">login</span>
</button>
</div>
<div class="mt-auto pt-6 text-center">
<p class="text-[11px] text-slate-500 font-medium">
                Protected by eGuy Secure Network Protocol
            </p>
</div>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-white/10 rounded-full"></div>
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
</div>

</body></html>
