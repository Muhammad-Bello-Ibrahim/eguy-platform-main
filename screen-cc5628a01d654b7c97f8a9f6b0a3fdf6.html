<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#47f0d1",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221e", // Matching theme requirement
                        "card-dark": "#162b26",
                        "input-dark": "#1c3530"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "1.25rem", // Requested 2xl rounded for inputs
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>eGuy - Step 2: Personal Details</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<!-- Phone Wrapper (iOS Form Factor) -->
<div class="w-full max-w-md bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative overflow-hidden">
<!-- Status Bar Space (iOS) -->
<div class="h-12 w-full"></div>
<!-- Header & Progress -->
<header class="px-6 py-4 flex flex-col gap-6">
<div class="flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-200 dark:bg-card-dark text-slate-700 dark:text-primary transition-all active:scale-95">
<span class="material-icons">chevron_left</span>
</button>
<span class="text-sm font-semibold text-slate-500 dark:text-primary/70">Step 2 of 3</span>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</div>
<!-- Progress Bar -->
<div class="w-full h-1.5 bg-slate-200 dark:bg-primary/10 rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 transition-all duration-500 shadow-[0_0_8px_rgba(71,240,209,0.5)]"></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 pt-4 pb-12 overflow-y-auto">
<div class="mb-8">
<h1 class="text-3xl font-bold mb-2 tracking-tight">Personal Details</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                    Please provide your legal information to help us secure your eGuy account.
                </p>
</div>
<form class="space-y-6">
<!-- Date of Birth -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-primary/60 ml-1">
                        Date of Birth
                    </label>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-input-dark border-0 rounded-2xl px-5 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary appearance-none" type="date" value="1995-01-01"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
<span class="material-icons text-xl">calendar_today</span>
</div>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-primary/60 ml-1">
                        Phone Number
                    </label>
<div class="flex gap-3">
<div class="w-28 relative">
<div class="h-14 bg-white dark:bg-input-dark rounded-2xl flex items-center justify-center gap-2 px-3 border-0 cursor-pointer">
<img alt="US Flag" class="w-6 h-4 rounded-sm object-cover" data-alt="Small United States flag icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDywZPEGPmMGjVxBrfJwWS3-S3r7G6xYBJXijh3aw8_WKHwZl4BOUZHNhpNlvxE8j8QkbEYOBmp8AP6yYwBS6p0rEv7bPU4sEqps3ilGSDt7DKXisapDvTtVfUNXgJyuUO54Za1OVhQARSqi0wQJG67vaQY4MrSiIP1Hh9E_MoUykIHTHoMZkN335nAn3tfYykHqFG-6q6NG-ntf43R8PR_72E2HgRWcu5Vq1LXS8EhFNd_G2bIYJ3gevwSGnLEBcbrJEFPpNkdQPs"/>
<span class="text-sm font-medium">+1</span>
<span class="material-icons text-sm text-slate-400">expand_more</span>
</div>
</div>
<input class="flex-1 h-14 bg-white dark:bg-input-dark border-0 rounded-2xl px-5 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary" placeholder="201 555 0123" type="tel"/>
</div>
</div>
<!-- Residential Address -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-primary/60 ml-1">
                        Residential Address
                    </label>
<div class="relative">
<textarea class="w-full bg-white dark:bg-input-dark border-0 rounded-2xl px-5 py-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary resize-none" placeholder="Street, City, Zip Code" rows="3"></textarea>
<div class="absolute right-4 top-4 text-slate-400">
<span class="material-icons text-xl">location_on</span>
</div>
</div>
</div>
<!-- Info Card -->
<div class="p-4 rounded-xl bg-primary/5 border border-primary/10 flex gap-3">
<span class="material-icons text-primary text-xl">verified_user</span>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-normal">
                        Your information is encrypted and never shared. We only use this for regulatory compliance (KYC).
                    </p>
</div>
</form>
</main>
<!-- Footer / Action Button -->
<footer class="p-6 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-primary/5">
<button class="w-full h-14 bg-primary text-[#10221e] font-bold text-lg rounded-2xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-icons">arrow_forward</span>
</button>
<p class="text-center mt-4 text-xs text-slate-400">
                Having trouble? <a class="text-primary font-medium" href="#">Contact Support</a>
</p>
</footer>
<!-- Bottom Home Indicator (iOS) -->
<div class="h-8 w-full flex justify-center items-end pb-2">
<div class="w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
<!-- Background Elements for Premium Feel -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-40 -left-24 w-48 h-48 bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
</div>
</body></html>
