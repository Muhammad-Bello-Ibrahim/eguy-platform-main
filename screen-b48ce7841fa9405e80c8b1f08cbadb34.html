<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>eGuy - Password Secured</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#47f066",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102214",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(71, 240, 102, 0.15);
        }
        .mesh-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(71, 240, 102, 0.08) 0%, rgba(16, 34, 20, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display selection:bg-primary selection:text-background-dark min-h-screen flex flex-col justify-center items-center overflow-hidden">
<!-- Background Decoration -->
<div class="fixed inset-0 mesh-gradient pointer-events-none"></div>
<div class="fixed -top-20 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed -bottom-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Content Container (Phone Form Factor) -->
<main class="relative w-full max-w-[430px] h-[932px] mx-auto flex flex-col px-8 py-12 justify-between items-center overflow-hidden">
<!-- Status Bar (Mock) -->
<div class="w-full flex justify-between items-center text-sm font-semibold opacity-80 mb-8">
<span>9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons-round text-base">signal_cellular_alt</span>
<span class="material-icons-round text-base">wifi</span>
<span class="material-icons-round text-base rotate-90">battery_full</span>
</div>
</div>
<!-- Success Animation/Icon Section -->
<div class="flex-1 flex flex-col items-center justify-center space-y-12">
<!-- Icon Frame -->
<div class="relative group">
<!-- Outer Glow Ring -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl group-hover:bg-primary/30 transition-all duration-700"></div>
<!-- Circular Frame -->
<div class="relative w-40 h-40 rounded-full border border-primary/20 bg-primary/5 flex items-center justify-center glow-effect backdrop-blur-sm">
<!-- Icon Inner Circle -->
<div class="w-32 h-32 rounded-full bg-primary/10 flex items-center justify-center border border-primary/30">
<span class="material-icons-round text-7xl text-primary drop-shadow-[0_0_15px_rgba(71,240,102,0.6)]">
                            check_circle
                        </span>
</div>
</div>
<!-- Floating Particles (Abstract) -->
<div class="absolute -top-2 -right-2 w-3 h-3 bg-primary rounded-full animate-pulse"></div>
<div class="absolute bottom-4 -left-3 w-2 h-2 bg-primary/40 rounded-full"></div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4">
<h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">
                    Password Secured
                </h1>
<p class="text-slate-500 dark:text-primary/60 text-base leading-relaxed max-w-[280px] mx-auto">
                    Your password has been updated successfully. You can now use your new credentials to sign in.
                </p>
</div>
</div>
<!-- Action Section -->
<div class="w-full space-y-6 pb-4">
<!-- Secondary Info (Optional Hint) -->
<div class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-primary/5 border border-primary/10">
<span class="material-icons-round text-primary text-sm">security</span>
<p class="text-[11px] uppercase tracking-[0.15em] font-bold text-primary/80">Account Protection Active</p>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-5 rounded-xl shadow-[0_10px_30px_-10px_rgba(71,240,102,0.4)] transition-all active:scale-[0.98] text-lg flex items-center justify-center gap-2">
                Back to Login
                <span class="material-icons-round">arrow_forward</span>
</button>
<!-- Footer Branding -->
<div class="flex flex-col items-center gap-2 opacity-40">
<div class="flex items-center gap-1.5">
<div class="w-5 h-5 bg-primary rounded-md flex items-center justify-center">
<span class="text-[10px] font-black text-background-dark">eG</span>
</div>
<span class="text-xs font-bold tracking-widest uppercase">eGuy Fintech</span>
</div>
</div>
</div>
<!-- iOS Home Indicator (Mock) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-400/20 rounded-full"></div>
</main>
<!-- Background Element for Premium Feel -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full max-w-[430px] border-[12px] border-slate-900/10 dark:border-white/5 rounded-[3rem] pointer-events-none z-50"></div>
</body></html>
