<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Login to eGuy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#47f0d1",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221e",
                        "surface-dark": "#131321",
                        "neutral-800": "#1a2e2a",
                        "neutral-900": "#0d1a17",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glow-on-focus:focus-within {
            box-shadow: 0 0 15px rgba(71, 240, 209, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6 overflow-hidden">
<!-- Background Decor -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Main Container (Mobile Form Factor) -->
<main class="relative w-full max-w-[400px] flex flex-col items-center">
<!-- Header Section -->
<header class="w-full text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-xl mb-6 border border-primary/20 shadow-lg shadow-primary/5">
<span class="material-icons-round text-primary text-4xl">shield</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight mb-2">Welcome Back</h1>
<p class="text-slate-400 font-medium">Securely access your eGuy account</p>
</header>
<!-- Login Card -->
<div class="w-full bg-surface-dark/80 dark:bg-surface-dark border border-white/5 p-8 rounded-xl shadow-2xl ios-blur">
<form class="space-y-6" onsubmit="return false;">
<!-- Email/Username Field -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500 ml-1">Email or Username</label>
<div class="relative flex items-center group glow-on-focus">
<span class="material-icons-round absolute left-4 text-slate-500 group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-neutral-900 border border-white/10 rounded-lg py-4 pl-12 pr-4 text-white placeholder:text-slate-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30 transition-all" placeholder="e.g. alex@eguy.io" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500">Password</label>
</div>
<div class="relative flex items-center group glow-on-focus">
<span class="material-icons-round absolute left-4 text-slate-500 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-neutral-900 border border-white/10 rounded-lg py-4 pl-12 pr-4 text-white placeholder:text-slate-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30 transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-slate-500 hover:text-white transition-colors" type="button">
<span class="material-icons-round text-lg">visibility_off</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-xs font-semibold text-primary/80 hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center space-x-2">
<span>Sign In</span>
<span class="material-icons-round text-xl">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 text-xs font-bold text-slate-600 uppercase tracking-widest">or access with</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<!-- Biometric Section -->
<div class="flex justify-center">
<button class="flex flex-col items-center space-y-2 group" type="button">
<div class="w-14 h-14 bg-neutral-900 border border-white/5 rounded-full flex items-center justify-center text-slate-400 group-hover:text-primary group-hover:border-primary/30 group-hover:bg-primary/5 transition-all shadow-inner">
<span class="material-icons-round text-3xl">fingerprint</span>
</div>
<span class="text-[10px] font-bold uppercase tracking-tighter text-slate-500 group-hover:text-primary transition-colors">Touch ID</span>
</button>
</div>
</form>
</div>
<!-- Footer Navigation -->
<footer class="mt-8 text-center">
<p class="text-slate-400 font-medium">
                Don't have an account? 
                <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-primary/30" href="#">Sign Up</a>
</p>
</footer>
<!-- Security Badge -->
<div class="mt-12 flex items-center space-x-2 text-slate-600">
<span class="material-icons-round text-sm">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-[0.2em]">Bank-grade 256-bit encryption</span>
</div>
</main>
<!-- iOS Home Indicator Simulation (Optional Visual) -->
<div class="fixed bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/10 rounded-full"></div>
</body></html>
